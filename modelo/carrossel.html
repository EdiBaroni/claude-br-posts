<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Modelo de carrossel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,500&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,600&family=DM+Mono:wght@500&display=block" rel="stylesheet">
<style>
  /* Modelo dos carrosseis do @claude.anthropic.br.
     Uso: carrossel.html?p=../posts/<post>/&n=<slide>. Cada post tem um post.js que define POST = { bg, slides: [...] }. */
  :root { --ink: #1f1e1d; --soft: #4a4843; --clay: #d97757; --green: #5f9a82; --amber: #e8a95b; --card: #ffffff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { background: var(--bg, #faf9f5); color: var(--ink); font-family: "DM Sans", sans-serif; position: relative; }
  .serif { font-family: "Source Serif 4", serif; font-weight: 500; letter-spacing: -0.02em; }
  .abs { position: absolute; }
  img { display: block; }
  /* slide "feature": selo + titulo + tela */
  .feat { position: absolute; inset: 0; padding: 130px 96px 150px; display: flex; flex-direction: column; }
  .feat .top { display: flex; justify-content: space-between; align-items: center; }
  .eyebrow { font-size: 32px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #3b3a36; }
  .badge { color: #fff; font-size: 32px; font-weight: 500; border-radius: 40px; padding: 8px 26px; }
  .feat h2 { font-size: 78px; line-height: 1.08; margin-top: 40px; }
  .feat .media { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; margin-top: 50px; }
  .feat .media img { max-width: 100%; max-height: 100%; width: 100%; object-fit: contain; border-radius: 18px; }
  .note { font-size: 34px; line-height: 1.38; color: var(--soft); margin-top: 34px; }
  /* slide centralizado */
  .center { position: absolute; inset: 0; padding: 120px 100px 170px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .center h2 { font-size: 96px; line-height: 1.06; }
  .center .sub { font-size: 40px; line-height: 1.4; color: var(--soft); margin-top: 44px; }
  .src { font-size: 30px; color: var(--soft); margin-top: 60px; }
  /* pecas reutilizaveis */
  .chip { position: absolute; background: #fff; border-radius: 14px; padding: 12px 24px; font-size: 30px; box-shadow: 0 8px 24px rgba(0,0,0,.08); white-space: nowrap; }
  .bubble { background: #fff; border-radius: 30px; padding: 36px 40px 30px; font-size: 37px; line-height: 1.36; box-shadow: 0 14px 40px rgba(0,0,0,.10); }
  .bubble .send { width: 52px; height: 52px; border-radius: 12px; background: var(--clay); color: #fff; font-size: 30px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin: 14px 0 0 auto; }
  .bubble b { font-weight: 700; font-style: italic; }
  .say { background: #fff; border-radius: 22px; padding: 26px 32px; font-size: 34px; line-height: 1.3; box-shadow: 0 12px 34px rgba(0,0,0,.10); }
  .shadow { box-shadow: 0 18px 48px rgba(0,0,0,.14); border-radius: 18px; }
  .line { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .line path { fill: none; stroke: var(--clay); stroke-width: 5; stroke-linecap: round; }
  .z { position: absolute; z-index: 1; }
  .tagchip { display: inline-flex; align-items: center; gap: 14px; background: #fff; border-radius: 16px; padding: 14px 28px; font-size: 34px; font-weight: 500; box-shadow: 0 6px 18px rgba(0,0,0,.06); }
  .tagchip i { width: 34px; height: 34px; border-radius: 8px; display: block; }
  /* rodape */
  .foot { position: absolute; left: 96px; right: 96px; bottom: 54px; display: flex; justify-content: space-between; font-size: 26px; color: #55534d; z-index: 5; }
  .foot b { font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>
<div class="foot"><b>@claude.anthropic.br · conteúdo não oficial</b><span id="pg"></span></div>
<script>
const q = new URLSearchParams(location.search);
const P = q.get("p") || "";
const N = parseInt(q.get("n") || "1", 10);
const img = (name, style = "", cls = "") => `<img class="${cls}" src="${P}telas/${name}.png" style="${style}">`;
const feature = s => `<div class="feat">
  <div class="top"><span class="eyebrow">${s.eyebrow}</span>${s.badge ? `<span class="badge" style="background:${s.badge.c}">${s.badge.t}</span>` : ""}</div>
  <h2 class="serif">${s.title}</h2>
  <div class="media">${img(s.img, s.imgStyle || "")}</div>
  ${s.note ? `<p class="note">${s.note}</p>` : ""}
</div>`;
const center = s => `<div class="center">${s.icon || ""}<h2 class="serif" style="${s.titleStyle || ""}">${s.title}</h2>${s.sub ? `<p class="sub">${s.sub}</p>` : ""}${s.src ? `<p class="src">${s.src}</p>` : ""}</div>`;
const s0 = document.createElement("script");
s0.src = P + "post.js";
s0.onload = () => {
  const slides = POST.slides;
  const s = slides[Math.min(Math.max(N, 1), slides.length) - 1];
  document.body.style.setProperty("--bg", s.bg || POST.bg || "#faf9f5");
  document.getElementById("app").innerHTML = s.type === "feature" ? feature(s) : s.type === "center" ? center(s) : s.html;
  document.getElementById("pg").textContent = N < slides.length ? `${N}/${slides.length} →` : `${N}/${slides.length}`;
};
document.head.appendChild(s0);
</script>
</body>
</html>
