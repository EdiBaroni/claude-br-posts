<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Carrossel Claude Duet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=DM+Sans:wght@400;500;600&display=block" rel="stylesheet">
<style>
  :root {
    --ink: #1f1e1d;
    --ink-soft: #3d3c3a;
    --line: #a9a9c6;
    --card: #f5f4ef;
    --bubble-claude: #e7e6e0;
    --bubble-user: #f1cbb8;
    --clay: #d97757;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    background: linear-gradient(180deg, #d5d5e3 0%, #cbcbda 55%, #a3a3ad 100%);
    color: var(--ink);
    font-family: "DM Sans", sans-serif;
    position: relative;
  }
  .swirl { position: absolute; inset: 0; z-index: 0; }
  .swirl path { fill: none; stroke: var(--line); stroke-width: 7; stroke-linecap: round; opacity: .75; }
  .slide { position: relative; z-index: 1; width: 100%; height: 100%; padding: 110px 96px 150px; display: flex; flex-direction: column; }
  .center { justify-content: center; align-items: center; text-align: center; }
  .serif { font-family: "Source Serif 4", serif; font-weight: 500; letter-spacing: -0.02em; }
  .tag {
    display: inline-block; font-size: 30px; font-weight: 500; color: var(--ink-soft);
    border: 2px solid #9a9aa8; border-radius: 10px; padding: 6px 18px; background: rgba(255,255,255,.35);
  }
  h1.cover { font-size: 168px; line-height: 1; margin: 36px 0 44px; }
  .sub { font-size: 62px; line-height: 1.12; }
  .pill {
    display: inline-flex; align-items: center; gap: 12px; margin-top: 70px;
    background: #fff; border-radius: 14px; padding: 16px 30px; font-size: 32px; font-weight: 600; letter-spacing: .02em;
  }
  h2 { font-size: 82px; line-height: 1.08; }
  .body { font-size: 44px; line-height: 1.35; color: var(--ink-soft); }
  .list { list-style: none; display: flex; flex-direction: column; gap: 34px; margin-top: 60px; }
  .list li { display: flex; gap: 28px; align-items: flex-start; font-size: 42px; line-height: 1.3; }
  .list .ico { flex: 0 0 72px; height: 72px; border-radius: 18px; background: rgba(255,255,255,.55); display: flex; align-items: center; justify-content: center; font-size: 40px; }
  .list b { font-weight: 600; color: var(--ink); }
  .list span.t { color: var(--ink-soft); }
  /* chat mockup */
  .phone { background: var(--card); border-radius: 36px; padding: 40px 40px; box-shadow: 0 20px 60px rgba(40,40,70,.18); display: flex; flex-direction: column; gap: 22px; }
  .b { max-width: 78%; padding: 22px 28px; border-radius: 26px; font-size: 34px; line-height: 1.32; }
  .b.c { background: var(--bubble-claude); align-self: flex-start; border-bottom-left-radius: 8px; }
  .b.u { background: var(--bubble-user); align-self: flex-end; border-bottom-right-radius: 8px; }
  .dots { align-self: flex-start; font-size: 40px; letter-spacing: 6px; color: #888; padding-left: 10px; }
  .mail { background: #fff; border-radius: 22px; padding: 26px 30px; font-size: 30px; line-height: 1.38; color: var(--ink-soft); }
  .mail .file { margin-top: 16px; border: 2px solid #e2e1db; border-radius: 12px; padding: 10px 16px; font-size: 26px; display: table; }
  .btns { display: flex; gap: 18px; margin-top: 20px; }
  .btns div { flex: 1; text-align: center; border-radius: 40px; padding: 14px; font-size: 28px; font-weight: 600; }
  .btns .no { border: 2px solid #d5d4ce; }
  .btns .yes { background: var(--ink); color: #fff; }
  .split { display: flex; flex-direction: column; gap: 90px; height: 100%; }
  .split h2 { text-align: center; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-top: 64px; }
  .fact { background: rgba(255,255,255,.5); border-radius: 26px; padding: 34px 34px; }
  .fact .k { font-size: 28px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #6b6a78; margin-bottom: 12px; }
  .fact .v { font-size: 40px; line-height: 1.25; font-weight: 500; }
  .warn { margin-top: 48px; font-size: 36px; line-height: 1.35; color: var(--ink-soft); border-left: 8px solid var(--clay); padding-left: 28px; }
  /* footer */
  .foot { position: absolute; left: 96px; right: 96px; bottom: 56px; display: flex; justify-content: space-between; align-items: center; font-size: 26px; color: #45444f; z-index: 2; }
  .foot .who { font-weight: 600; }
  .foot .arrow { font-weight: 600; }
</style>
</head>
<body>
<svg class="swirl" viewBox="0 0 1080 1350" preserveAspectRatio="none" id="swirl"></svg>
<div id="app"></div>
<div class="foot"><span class="who">@claude.anthropic.br · conteúdo não oficial</span><span id="pg"></span></div>
<script>
const swirls = [
  "M -60 900 C 220 860, 430 980, 600 820 C 760 670, 980 700, 960 860 C 940 1020, 700 1000, 720 860 C 740 720, 950 700, 1160 760",
  "M -60 1000 C 300 900, 700 880, 1160 760",
  "M -60 1180 C 300 1080, 760 1120, 1160 980",
  "M -60 300 C 280 240, 560 380, 760 260 C 900 180, 1040 220, 1160 160",
  "M -60 1220 C 260 1150, 520 1250, 760 1150 C 920 1080, 1040 1120, 1160 1060",
  "M -60 1130 C 320 1060, 640 1180, 1160 1080",
  "M -60 1160 C 280 1060, 600 1180, 860 1060 C 980 1000, 1080 1020, 1160 990"
];
const slides = [
`<div class="slide center">
  <span class="tag">Prévia de pesquisa</span>
  <h1 class="serif cover">Claude Duet</h1>
  <p class="serif sub">O novo app em que<br>o Claude vem até você</p>
  <span class="pill">Arraste para saber mais →</span>
</div>`,
`<div class="slide center">
  <h2 class="serif" style="font-size:96px">Um agente que trabalha <em>com</em> você</h2>
  <p class="body" style="margin-top:56px;max-width:860px">Ele mostra o que precisa da sua atenção, faz as tarefas que você pede e continua trabalhando quando você se afasta.</p>
  <p class="body" style="margin-top:36px;max-width:860px">Feito para profissionais e donos de pequenos negócios.</p>
</div>`,
`<div class="slide">
  <h2 class="serif">O que ele faz<br>no seu dia</h2>
  <ul class="list">
    <li><div class="ico">☀️</div><div><b>Resumo pela manhã</b> <span class="t">com o mais importante dos seus apps conectados</span></div></li>
    <li><div class="ico">👀</div><div><b>Fica de olho</b> <span class="t">e só chama você quando algo precisa da sua decisão</span></div></li>
    <li><div class="ico">✅</div><div><b>Resolve tarefas:</b> <span class="t">agenda reuniões, monta painéis, previsões de vendas e até apps web</span></div></li>
    <li><div class="ico">🔌</div><div><b>+6.000 conectores:</b> <span class="t">Gmail, Slack, QuickBooks, Shopify, HubSpot, Canva…</span></div></li>
  </ul>
</div>`,
`<div class="slide" style="padding-top:90px">
  <div class="split">
    <div class="phone">
      <div class="b u">Fecha os números do mês pra mim?</div>
      <div class="b c">Já estou nisso. Buscando no ponto de venda, na loja online, no CRM, no suporte, na folha de pagamento e no banco.</div>
      <div class="dots">•••</div>
    </div>
    <h2 class="serif" style="font-size:76px">Ele traz o que precisa da sua atenção — e continua trabalhando quando você se afasta.</h2>
  </div>
</div>`,
`<div class="slide" style="padding-top:90px">
  <div class="split" style="gap:70px">
    <div class="phone">
      <div class="mail">Olá, Jenn,<br>Parabéns! Temos o prazer de oferecer a você a vaga de Gerente de Atacado. Os detalhes da proposta estão em anexo.<br>Nicole
        <div class="file">📄 proposta-jenn.pdf</div>
        <div class="btns"><div class="no">Agora não</div><div class="yes">Enviar</div></div>
      </div>
      <div class="b u">Coloca no final que estou muito animada em ter ela no time</div>
    </div>
    <div style="text-align:center">
      <h2 class="serif" style="font-size:104px">A palavra final<br>é sua.</h2>
      <p class="body" style="margin-top:30px;font-size:38px">Antes de enviar, pagar, assinar ou apagar algo, ele mostra a ação e espera sua aprovação.</p>
    </div>
  </div>
</div>`,
`<div class="slide">
  <h2 class="serif">Funciona mesmo com<br>o celular desligado</h2>
  <ul class="list">
    <li><div class="ico">☁️</div><div><span class="t">Roda numa <b>máquina virtual própria</b>, com navegador: seu notebook ou celular não precisa ficar ligado</span></div></li>
    <li><div class="ico">🧠</div><div><span class="t">Usa a <b>memória, as habilidades e os apps</b> que você já conectou ao Claude</span></div></li>
    <li><div class="ico">🎙️</div><div><span class="t">Uma <b>conversa contínua</b>, por texto ou voz</span></div></li>
    <li><div class="ico">🔒</div><div><span class="t"><b>Investir ou transferir dinheiro</b> entre contas: proibido, mesmo com sua aprovação</span></div></li>
  </ul>
</div>`,
`<div class="slide">
  <h2 class="serif">Quando chega?</h2>
  <div class="facts">
    <div class="fact"><div class="k">Lançamento</div><div class="v">21 de outubro de 2026</div></div>
    <div class="fact"><div class="k">Formato</div><div class="v">Prévia de pesquisa, com lista de espera</div></div>
    <div class="fact"><div class="k">Onde</div><div class="v">Apps para iOS e Android, e claude.ai</div></div>
    <div class="fact"><div class="k">Preço</div><div class="v">Incluído nos planos Pro e Max</div></div>
  </div>
  <p class="warn">Começa pelos assinantes Pro e Max dos <b>Estados Unidos</b>.</p>
  <p class="body" style="margin-top:48px;font-size:32px">Fonte: Anthropic · claude.com</p>
</div>`
];
const n = Math.min(Math.max(parseInt(new URLSearchParams(location.search).get("n") || "1", 10), 1), slides.length);
document.getElementById("app").innerHTML = slides[n - 1];
document.getElementById("swirl").innerHTML = `<path d="${swirls[n - 1]}"/>`;
document.getElementById("pg").innerHTML = n < slides.length ? `${n}/${slides.length} <span class="arrow">→</span>` : `${n}/${slides.length}`;
</script>
</body>
</html>
