# Quando o agendador grava agendado.json (ou falha-agendamento.md), avisa na ficha.
name: Avisar agendamento

on:
  push:
    branches: [main]
    paths:
      - "noticias/*/agendado.json"
      - "noticias/*/falha-agendamento.md"

permissions:
  contents: read
  issues: write

concurrency:
  group: avisar-agendado
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comentar na ficha
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          node robo/scripts/avisar-agendado.mjs
